# Max nRF52840 TX power (default 0 dBm) - fixes range/dropouts
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Show the right half's battery on the left nice!view
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Dark theme (pale ink on black). On this panel that is the non-inverted setting.
CONFIG_NICE_VIEW_WIDGET_INVERTED=n

# Underglow, as on the working refresh_mips build. It also powers the VCC rail
# (ext_power) at boot, which the nice!view runs from.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25
